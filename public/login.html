<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eeeef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<title>Sign in - Agent Console</title><link rel="icon" href="/icon.svg"><link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/style.css"></head>
<body class="login"><form id="f" class="login-card">
<img class="mark" src="/icon.svg" alt="" width="56" height="56">
<h1>Agent Console</h1>
<!-- biome-ignore lint/a11y/noAutofocus: the password field is the only input on the login page -->
<label>Password<input id="pw" class="input" type="password" autocomplete="current-password" autofocus required></label>
<button type="submit" class="btn primary">Sign in</button><p id="err" class="err" role="alert"></p>
</form><script type="module" src="/login.js"></script></body></html>
