<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Brain · Agent Console</title>
<link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#eeeef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/ideas.css"><link rel="stylesheet" href="/brain.css"></head>
<body class="ideas brain">
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" width="0" height="0">
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
</svg>
<header class="dh">
  <a class="btn ghost back" id="back" href="/" aria-label="Back to the console"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg><span>Console</span></a>
  <h1 id="title">Brain</h1>
  <!-- biome-ignore lint/a11y/useSemanticElements: role=group on a div styled by .range; fieldset would change the layout -->
  <div class="range" id="viewToggle" role="group" aria-label="View">
    <button type="button" id="viewList" aria-pressed="true">List</button>
    <button type="button" id="viewGraph" aria-pressed="false">Graph</button>
  </div>
</header>
<main id="bm" aria-busy="true">
  <search>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="Search pages, tags, descriptions" aria-label="Search the brain" maxlength="200">
  </form>
  </search>
  <div class="subbar">
    <button type="button" class="btn field" id="tagFilter" aria-label="Filter by tags"><span id="tagFilterLabel">All tags</span><svg class="ico" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
    <!-- biome-ignore lint/a11y/useSemanticElements: role=group on a div styled by .range; fieldset would change the layout -->
    <div class="range" id="listTabs" role="group" aria-label="List">
      <button type="button" id="tabPages" aria-pressed="true">Pages</button>
      <button type="button" id="tabTags" aria-pressed="false">Tags</button>
    </div>
    <span class="muted" id="count" aria-live="polite"></span>
  </div>
  <p class="muted" id="status" aria-live="polite">Loading the brain…</p>
  <section id="listView" aria-label="Brain pages">
    <ul class="group" id="pageList"></ul>
    <ul class="group" id="tagList" hidden></ul>
  </section>
  <section id="graphView" aria-label="Brain graph" hidden>
    <div class="graph-wrap">
      <div id="cy" role="img" aria-label="Graph of brain pages and tags. Use List view for a text version."></div>
      <div class="graph-toolbar" role="toolbar" aria-label="Graph controls">
        <button type="button" class="btn ghost icon" id="zoomOut" aria-label="Zoom out"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
        <button type="button" class="btn ghost icon" id="zoomIn" aria-label="Zoom in"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
        <button type="button" class="btn ghost" id="fitGraph">Fit</button>
        <button type="button" class="btn ghost tog" id="linksToggle" aria-pressed="false">Page links</button>
      </div>
      <div class="graph-legend-card">
        <button type="button" class="legend-toggle" id="legendToggle" aria-expanded="true" aria-controls="legendBody">Legend</button>
        <div id="legendBody">
          <ul class="graph-legend" aria-label="Graph legend">
            <li><i class="legend-node wiki" aria-hidden="true"></i>Wiki page</li>
            <li><i class="legend-node ops" aria-hidden="true"></i>Operating note</li>
            <li><i class="legend-node tag-node" aria-hidden="true"></i>Tag</li>
            <li><i class="legend-line" aria-hidden="true"></i>Tagged with</li>
            <li><i class="legend-line page-link" aria-hidden="true"></i>Page link</li>
          </ul>
          <p class="legend-note">Zoom for labels. Select a node for details.</p>
        </div>
      </div>
    </div>
  </section>
  <p class="muted foot" id="stamp"></p>
</main>
<div id="scrim" hidden></div>
<aside id="sheet" class="sidesheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden>
  <div class="sheethead">
    <!-- biome-ignore lint/a11y/useHeadingContent: the sheet title is filled in by brain.js -->
    <h2 id="sheetTitle"></h2>
    <button type="button" class="btn ghost icon" id="sheetClose" aria-label="Close details"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="sheetBody" class="sheetbody"></div>
</aside>
<script type="module" src="/brain.js"></script>
</body></html>
