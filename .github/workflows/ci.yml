# Unit and UI suites against a mock scratch server, then one Pi end-to-end smoke against a local model stub.
# No secrets: nothing here calls a real model. A green run on main triggers the console's deploy hook
# (workflow_run webhook → git pull → idle restart), so keep the workflow name in sync with that hook.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check: every PR carries the one token-telemetry comment (the server posts it, even if only
  # "No agent usage recorded."). Add "telemetry-comment" to the branch protection required checks.
  telemetry-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Require token telemetry comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for attempt in $(seq 1 20); do
            count="$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" --jq '.[] | select(.body | startswith("<!-- agent-console-telemetry -->")) | .id' | grep -c . || true)"
            if [ "${count:-0}" -ge 1 ]; then echo "Telemetry comment found."; exit 0; fi
            echo "No telemetry comment yet (attempt $attempt of 20)."; [ "$attempt" -lt 20 ] && sleep 15
          done
          echo "::error::No agent-console telemetry comment on this PR."; exit 1
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_CONSOLE_PAGE: "12"
      PI_VERSION: "1.2.0"
      # Every test file, scratch server and CLI spawn reloads the same TypeScript graph; caching the
      # compiled code cut one script start from about 0.75 s to 0.25 s.
      NODE_COMPILE_CACHE: /tmp/node-compile-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No setup-python: CI runs only stdlib Python tests on the runner's python3. requirements-triage.txt
      # serves the offline calibration fit (npm run test:effort-fit), which CI does not run.
      - run: npm ci
      - name: Start resource sampler
        run: nohup node scripts/ci-resources.mjs sample "$RUNNER_TEMP/resources.csv" >/dev/null 2>&1 &
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      # The runner image ships Google Chrome, so Chromium's system libraries are already present;
      # --with-deps ran apt-get and took up to 9 minutes.
      - run: npx playwright install chromium
      # Pi goes into its own prefix so the whole install can be cached; npm install -g took 6-8 s per run.
      - name: Cache Pi
        id: pi-cache
        uses: actions/cache@v4
        with:
          path: ~/.pi-cli
          key: pi-${{ env.PI_VERSION }}-node24-${{ runner.os }}
      - name: Install Pi
        if: steps.pi-cache.outputs.cache-hit != 'true'
        run: npm install -g --prefix ~/.pi-cli "@earendil-works/pi-coding-agent@$PI_VERSION"
      - run: echo "$HOME/.pi-cli/bin" >>"$GITHUB_PATH"
      - name: Start mock scratch server
        run: |
          mkdir -p test/tmp
          data="$(mktemp -d)"
          # Tests mint session cookies from the same data directory's secret.
          echo "AGENT_CONSOLE_DATA=$data" >>"$GITHUB_ENV"
          # Production runs the bundle (bin/agent-console supervise); test that, not the sources.
          node scripts/bundle-server.mjs
          AGENT_CONSOLE_MOCK=1 AGENT_CONSOLE_DATA="$data" AGENT_CONSOLE_RUN="$data/run" AGENT_CONSOLE_BRAIN="$data/no-brain" \
            PORT=7070 nohup node .bundle/server/index.ts.mjs >"$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:7070/login && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      # One parallel pool: unit suites plus the UI and Pi smoke suites, each on its own port.
      # TEST_CONCURRENCY above the CPU count pays off because most files wait on servers and browsers.
      - name: Tests
        shell: bash
        env:
          TEST_CONCURRENCY: "8"
        run: npm test -- test/composer-scroll-ui.ts test/drafts-ui.ts test/attachment-drafts-ui.ts test/pi-e2e-ui.ts 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Fails the run when one file or the whole pool gets slower than the budget, so test time cannot creep up.
      - name: Test time budget
        env:
          TEST_FILE_BUDGET_S: "10"
          TEST_WALL_BUDGET_S: "25"
        run: node scripts/ci-resources.mjs budget "$RUNNER_TEMP/test.log"
      - name: Runner usage
        if: always()
        run: node scripts/ci-resources.mjs summary "$RUNNER_TEMP/resources.csv" "$RUNNER_TEMP/test.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Server log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/server.log"
